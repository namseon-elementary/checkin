# Netlify config for 남선초등학교 감정체크
# 정적 사이트 (빌드 없음), 저장소 루트에서 그대로 서빙

[build]
  publish = "."

# 루트로 접속하면 감정체크 앱으로
[[redirects]]
  from = "/"
  to = "/emotion_check_3.html"
  status = 200

# 특별 미션 페이지는 짧은 경로 지원
[[redirects]]
  from = "/mission"
  to = "/special-mission.html"
  status = 200

# 캐시 정책: HTML은 매번 새로 (즉시 반영), 이미지/폰트는 오래
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.ttf"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
